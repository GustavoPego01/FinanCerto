services:
  waha:
    # Pin a tested tag or digest in WAHA_IMAGE; do not silently upgrade production.
    image: ${WAHA_IMAGE:?Set a tested devlikeapro/waha tag or digest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_LOG_LEVEL: warn
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/sessions',{headers:{'X-Api-Key':process.env.WAHA_API_KEY}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  waha_sessions:
